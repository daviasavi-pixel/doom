function updateEndCutscene(dt){
 endCutT+=dt; const t=endCutT; fl.intensity=0;
 
 // Animações de passos do herói
 const runSpeed=t<3 ? 12 : 0;
 const legAngle=Math.sin(t*runSpeed)*.6;
 hero.lLeg.rotation.x=legAngle; hero.rLeg.rotation.x=-legAngle;
 hero.lArm.rotation.x=-legAngle; hero.rArm.rotation.x=legAngle;

 if(t<1.2){
  $('blk').style.opacity=Math.max(0, 1 - t/1.2);
 }
 
 if(t<3.2){
  // Herói corre para longe do prédio
  hero.g.position.z += dt*2.8;
  cam.position.set(EX + 3, 1.8, EZ + hero.g.position.z + 4.5);
  cam.lookAt(EX, 2.2, EZ + hero.g.position.z - 1);
  if(t>1.5) $('cap').textContent='Olhando para trás uma última vez...';
 } else if(t<5.5){
  // Herói para e se vira para a pizzaria
  if(!endCutF.turn){
   endCutF.turn=1; hero.g.rotation.y=0;
   gasCan.visible=true; gasCan.position.set(EX + hero.g.position.x + .3, .8, EZ + hero.g.position.z + .2);
   $('cap').textContent='Chegou a hora de dar um fim nisso tudo.';
  }
  cam.position.set(EX - 2.5, 1.5, EZ + hero.g.position.z + 2.5);
  cam.lookAt(EX, 2, EZ - 6);
 } else if(t<8.0){
  // Arremessa o galão/isqueiro e coloca fogo
  if(!endCutF.throw){
   endCutF.throw=1;
   tone(120,40,.8,.8,'sawtooth'); burst(.9,1.5,300,'lowpass');
  }
  const throwProgress=Math.min(1, (t-5.5)/1.5);
  gasCan.position.z = EZ + hero.g.position.z - throwProgress*5;
  gasCan.position.y = .8 + Math.sin(throwProgress*Math.PI)*1.2;
  gasCan.rotation.x += dt*8;
  
  if(throwProgress>=0.95 && !endCutF.ignite){
   endCutF.ignite=1; fireMesh.visible=true;
   burst(1,2,1500,'bandpass'); tone(80,180,1,2,'sawtooth');
   $('cap').textContent='O passado finalmente queima nas chamas...';
  }
  cam.position.set(EX, 2.5, EZ + hero.g.position.z + 5);
  cam.lookAt(EX, 3.5, EZ - 7);
 } else if(t<14.0){
  // O fogo toma conta do prédio estilo final de filme
  fireLight.intensity = 3.5 + Math.sin(t*15)*1.2 + Math.random()*.8;
  
  // Atualiza partículas de fogo
  for(let i=0;i<NF;i++){
   const f=fireData[i]; f.y+=f.vy*dt; if(f.y>7.5){f.y=.5; f.x=rr(-11,11)}
   dm.position.set(f.x, f.y, f.z);
   dm.scale.setScalar(f.s * (1 - f.y/8));
   dm.updateMatrix(); fireMesh.setMatrixAt(i, dm.matrix);
  }
  fireMesh.instanceMatrix.needsUpdate=true;

  hero.g.rotation.y = Math.PI; // Vira de costas para a explosão e anda devagar
  hero.g.position.z += dt*0.5;
  
  cam.position.set(EX, 1.6, EZ + hero.g.position.z + 3.8);
  cam.lookAt(EX, 2.2, EZ - 8);
  
  if(t>11.5){
   $('blk').style.opacity = Math.min(1, (t-11.5)/2.5);
  }
 } else {
  // Fim do filme
  extGroup.visible=false; hero.g.visible=false;
  over(true);
 }
}
